[project]
name = "foreign-trade-api"
version = "0.1.0"
description = "AI Foreign Trade Sales Platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using .*starlette.testclient.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
